    <script>
      // Apply theme before first paint (no light flash in dark mode).
      try {
        var t = (JSON.parse(localStorage.getItem("aiiq.prefs")) || {}).theme || "system";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
