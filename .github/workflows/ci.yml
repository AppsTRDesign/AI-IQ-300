name: CI

# Every push and pull request: the version is the same everywhere, the frontend builds, the whole test suite passes.
# A tag push (vX.Y.Z) also checks that the tag matches VERSION. Tests never reach real models or the real data/
# folder (tests/conftest.py uses a temporary AIIQ_DATA and points local model servers at a closed port).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Version check
        shell: pwsh
        run: python set_version.py --check "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install chromium

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider

      # The agent-evaluation harness against its scripted solver model (no real model): an isolated app runs the five
      # tasks, a real browser checks the web app and the proxy really cuts the connection. Real models are run by hand
      # (eval/README.md).
      - name: Eval self-test (mock model)
        run: python eval/run_eval.py --models mock --timeout 300
